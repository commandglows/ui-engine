name: shipglows_reviews_example
description: Playground for shipglows_reviews on Windows and the web — the invitation, the form, the settings rows, offline sending.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  shipglows_feedback:
    path: ../../shipglows_feedback
  shipglows_reviews:
    path: ..
  shipglows_theme:
    path: ../../shipglows_theme

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
