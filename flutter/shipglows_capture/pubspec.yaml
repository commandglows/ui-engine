name: shipglows_capture
description: Camera capture for ShipGlows Flutter apps (Android, iOS, Windows, web), the first part of the shared capture package; list the device's cameras, preview one, record a video with sound or take a photo, with typed failures and each platform's limits.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  # Not endorsed by `camera`: Windows apps only get it when it is listed.
  camera_windows: ^0.3.0+1
  shipglows_icons:
    path: ../shipglows_icons
  shipglows_theme:
    path: ../shipglows_theme

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
