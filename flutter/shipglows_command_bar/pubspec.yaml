version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_theme:
    path: ../shipglows_theme
  shipglows_menu:
    path: ../shipglows_menu
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
