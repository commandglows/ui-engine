name: shipglows_settings
description: Typed user settings for ShipGlows Flutter apps, saved on the device first and synced per account through a pluggable remote.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_settings_core:
    path: ../../core/shipglows_settings_core
  shipglows_sync_core:
    path: ../../core/shipglows_sync_core

dev_dependencies:
  shipglows_lints:
    path: ../../foundation/shipglows_lints
  flutter_test:
    sdk: flutter
