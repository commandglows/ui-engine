name: shipglows_ai
description: OpenRouter client for ShipGlows Flutter apps on Android, iOS, macOS, Windows, Linux and the web — chat completions, streaming, the model list and a key check, with the user's key kept in a swappable key store.
version: 0.2.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  http: ^1.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
