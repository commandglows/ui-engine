name: shipglows_pdf
description: A PDF reader for ShipGlows Flutter apps, with page, scroll and automatic reading modes, zoom and a saveable reading position.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: 2.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
