name: shipglows_storage
description: Files kept away from this computer for ShipGlows Flutter apps — one BlobStore interface over S3-compatible buckets (R2, MinIO, AWS, SigV4-signed), synchronised folders and memory.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.8
  shipglows_xml:
    path: ../shipglows_xml
  web: ^1.1.1

dev_dependencies:
  shipglows_lints:
    path: ../../foundation/shipglows_lints
  flutter_test:
    sdk: flutter
