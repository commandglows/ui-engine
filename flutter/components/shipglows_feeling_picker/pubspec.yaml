name: shipglows_feeling_picker
description: Shared picker for naming feelings, with suggested words, a sheet browsing the whole bank by family, search and the person's own words.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_feelings:
    path: ../../core/shipglows_feelings
  shipglows_tag_picker:
    path: ../shipglows_tag_picker
  shipglows_theme:
    path: ../../foundation/shipglows_theme

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
