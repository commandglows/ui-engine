name: shipglows_bulk_delete
description: Shared dialog to delete many items at once, choosing their types and period, with live counts and pinned items left out unless asked.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_date_sections:
    path: ../shipglows_date_sections
  shipglows_tag_picker:
    path: ../shipglows_tag_picker
  shipglows_theme:
    path: ../../foundation/shipglows_theme

dev_dependencies:
  shipglows_lints:
    path: ../../foundation/shipglows_lints
  flutter_test:
    sdk: flutter
