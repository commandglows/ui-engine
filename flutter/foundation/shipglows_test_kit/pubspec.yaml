name: shipglows_test_kit
description: Test helpers shared by the ShipGlows Flutter apps and packages, for reduced motion, temporary app folders and in-memory preferences. A dev dependency only.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.6

dev_dependencies:
  shipglows_lints:
    path: ../shipglows_lints
