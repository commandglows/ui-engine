name: shipglows_theme
description: Shared semantic theme roles, bundled fonts (Inter, Cal Sans, JetBrains Mono), scrollbars and base components (keycaps, key buttons, key hints, empty states, focus rings) for ShipGlows Flutter apps and packages.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # Fonts every ShipGlows app gets by default (SIL OFL 1.1, licenses next to
  # the files). Apps reach them through ShipglowsFonts, never by file name.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: Cal Sans
      fonts:
        - asset: fonts/CalSans-Regular.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
