name: shipglows_contact
description: Backend-free Contact us button for ShipGlows Flutter apps, opening a list of contact channels (WhatsApp, Messenger, Instagram, Telegram, email, phone, SMS, any link) launched through deeplinks.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_feedback:
    path: ../shipglows_feedback
  shipglows_icons:
    path: ../shipglows_icons
  shipglows_theme:
    path: ../shipglows_theme
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
