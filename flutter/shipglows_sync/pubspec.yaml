name: shipglows_sync
description: Device-to-account sync for ShipGlows Flutter apps — status, first-sync review of local versus account copies, recovery copies, and the widgets that tell the user where their data stands.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_icons:
    path: ../shipglows_icons
  shipglows_sync_core:
    path: ../shipglows_sync_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
