name: shipglows_hotkeys
description: System-wide triggers (key combinations, a key pressed twice, mouse gestures with or without modifier keys) tied to actions, with conflict reporting and saved user choices, for ShipGlows desktop Flutter apps.
version: 0.3.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: ShipglowsHotkeysPluginCApi
