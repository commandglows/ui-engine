name: shipglows_account_deletion
description: Shared account deletion for ShipGlows Flutter apps, a button with its confirmation, reconnection, server deletion and sign-out; each app provides only the call that erases its own data.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_clerk_auth:
    path: ../../services/shipglows_clerk_auth
  shipglows_feedback:
    path: ../../components/shipglows_feedback
  shipglows_theme:
    path: ../../foundation/shipglows_theme

dev_dependencies:
  shipglows_lints:
    path: ../../foundation/shipglows_lints
  flutter_test:
    sdk: flutter
