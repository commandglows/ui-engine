name: shipglows_reviews
description: Customer reviews for ShipGlows Flutter apps on Android, iOS, macOS, Windows and the web — the store rating prompt or an in-app invitation at the right moment, a review form sent to the app's backend, the public rating page and the settings rows.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  in_app_review: ^2.0.10
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  shipglows_feedback:
    path: ../../components/shipglows_feedback
  shipglows_icons:
    path: ../../foundation/shipglows_icons
  shipglows_settings_core:
    path: ../../core/shipglows_settings_core
  shipglows_theme:
    path: ../../foundation/shipglows_theme
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
