name: shipglows_notification_center
description: Shared notification center (latest notifications, read state, mark all read, delete), daily system reminders (Windows, Android) and snooze options for ShipGlows Flutter apps.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  shipglows_feedback:
    path: ../../components/shipglows_feedback
  shipglows_icons:
    path: ../../foundation/shipglows_icons
  shipglows_theme:
    path: ../../foundation/shipglows_theme
  timezone: ^0.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
