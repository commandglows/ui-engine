name: shipglows_onboarding
description: First-run introduction for ShipGlows Flutter apps — a two-column card of pages (language, welcome, features, access) with a segmented progress bar, shown once per account.
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_icons:
    path: ../../foundation/shipglows_icons
  shipglows_theme:
    path: ../../foundation/shipglows_theme

dev_dependencies:
  shipglows_lints:
    path: ../../foundation/shipglows_lints
  flutter_test:
    sdk: flutter
