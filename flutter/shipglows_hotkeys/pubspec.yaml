name: shipglows_hotkeys
description: System-wide hotkeys (work while the app is in the background) with conflict reporting and saved user choices, for ShipGlows desktop Flutter apps.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: ShipglowsHotkeysPluginCApi
