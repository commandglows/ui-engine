name: shipglows_storage
description: Files kept away from this computer for ShipGlows Flutter apps — one BlobStore interface over S3-compatible buckets (R2, MinIO, AWS, SigV4-signed), synchronised folders and memory.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  shipglows_xml:
    path: ../shipglows_xml

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
