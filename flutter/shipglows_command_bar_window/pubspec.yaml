name: shipglows_command_bar_window
description: The shared ShipGlows command bar in its own floating desktop window (own Flutter engine, always on top).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_command_bar:
    path: ../shipglows_command_bar
  shipglows_hotkeys:
    path: ../shipglows_hotkeys
  shipglows_menu:
    path: ../shipglows_menu
  shipglows_overlay_window:
    path: ../shipglows_overlay_window

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
