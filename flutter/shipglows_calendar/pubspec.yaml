name: shipglows_calendar
description: Shared calendar views (day, week, month, agenda, day strip, mini month), event model and time-zone seam for ShipGlows Flutter apps.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_theme:
    path: ../shipglows_theme

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
