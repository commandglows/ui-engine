name: shipglows_notification_center
description: Shared notification center (latest notifications, read state, mark all read, delete) for ShipGlows Flutter apps, over a store the app plugs in.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shipglows_feedback:
    path: ../shipglows_feedback
  shipglows_icons:
    path: ../shipglows_icons
  shipglows_theme:
    path: ../shipglows_theme

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
